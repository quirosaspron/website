<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Conway's Game of Life in Mateo Quiros Aspron's portfolio intro layout.">
    <title>Game of Life · Intro preview</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20261024-m">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root { --rail-width: 142px; --background: #f7f7f2; --foreground: #151515; --secondary: #716f69; --line: rgba(21,21,21,.24); --ui-font: "Inter", Arial, sans-serif; --display-font: Optima, "Optima Nova", "Segoe UI", Arial, sans-serif; }
      body.dark { --background: #151515; --foreground: #f1efe9; --secondary: #a9a7a1; --line: rgba(241,239,233,.28); }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { color: var(--foreground); background: var(--background); font: 14px/1.4 var(--ui-font); transition: color .18s, background .18s; }
      button, a { color: inherit; font: inherit; }
      a { text-decoration: none; }
      .hero { position: relative; min-height: max(620px, 100svh); padding: 34px 6vw 42px calc(var(--rail-width) + 6vw); overflow: hidden; }
      .rail { position: absolute; inset: 0 auto 0 0; z-index: 3; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; width: var(--rail-width); padding: 22px 20px; border-right: 1px solid var(--line); background: var(--background); }
      .rail a { color: var(--secondary); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
      .rail a:hover { color: var(--foreground); }
      .theme-button { display: grid; place-items: center; width: 42px; height: 42px; margin-top: auto; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; cursor: pointer; font-size: 18px; }
      .life-art { position: absolute; top: 12px; right: 20px; left: calc(var(--rail-width) + 12px); height: min(57vh, 410px); z-index: 0; overflow: hidden; touch-action: none; }
      .life-art canvas { display: block; }
      .life-controls { position: absolute; top: 20px; right: 24px; z-index: 2; display: flex; align-items: center; gap: 3px; padding: 3px; border-radius: 20px; background: var(--background); }
      .life-controls button { display: grid; place-items: center; width: 29px; height: 29px; padding: 6px; border: 0; border-radius: 50%; background: transparent; color: var(--secondary); cursor: pointer; }
      .life-controls button:hover, .life-controls button:focus-visible { background: var(--line); color: var(--foreground); }
      .life-controls svg { display: block; width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .life-controls .icon-play { display: none; }
      .life-controls #life-play[aria-pressed="false"] .icon-play { display: block; }
      .life-controls #life-play[aria-pressed="false"] .icon-pause { display: none; }
      .intro-copy { position: absolute; right: 6vw; bottom: 110px; left: calc(var(--rail-width) + 6vw); z-index: 2; pointer-events: none; }
      .intro-copy::before { content: ""; position: absolute; inset: -36px -26px; z-index: -1; background: radial-gradient(ellipse at 35% 55%, color-mix(in srgb, var(--background) 68%, transparent) 0%, color-mix(in srgb, var(--background) 32%, transparent) 50%, transparent 82%); }
      .intro-copy h1 { margin: 0 0 24px; font: 400 clamp(2.4rem, 4vw, 5.2rem)/1 var(--display-font); letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; -webkit-text-stroke: 2px var(--background); paint-order: stroke fill; }
      .intro-copy h1 span + span { margin-left: .44em; }
      .intro-copy p { margin: 0 0 9px; color: var(--secondary); font-size: 12px; -webkit-text-stroke: 1px var(--background); paint-order: stroke fill; }
      @media (max-width: 720px) {
        :root { --rail-width: 112px; }
        .hero { min-height: 100svh; padding: 24px; }
        .rail { width: var(--rail-width); padding: 18px 16px; }
        .life-art { top: 8px; right: 12px; left: calc(var(--rail-width) + 8px); height: min(38vh, 248px); }
        .life-controls { top: 18px; right: 16px; }
        .intro-copy { right: 24px; bottom: 86px; left: 136px; }
        .intro-copy h1 { font-size: 2.8rem; letter-spacing: .12em; white-space: normal; }
        .intro-copy h1 span { display: inline-block; }
        .intro-copy h1 span + span { margin-left: .24em; }
        .intro-copy p { font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <main class="hero" aria-labelledby="name">
      <aside class="rail" aria-label="Preview navigation">
        <a href="./index.html">Main site ↗</a>
        <button class="theme-button" id="life-theme" type="button" aria-label="Switch to dark mode">◐</button>
      </aside>
      <div class="life-art" id="life-art" role="img" aria-label="Animated Conway's Game of Life"></div>
      <div class="life-controls" aria-label="Game of Life controls">
        <button id="life-play" type="button" aria-label="Pause animation" aria-pressed="true">
          <svg class="icon-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4v12M13 4v12"/></svg>
          <svg class="icon-play" viewBox="0 0 20 20" aria-hidden="true"><path d="m6 3 10 7-10 7z"/></svg>
        </button>
        <button id="life-clear" type="button" aria-label="Clear animation">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M7 5V3h6v2M6 7l.7 9h6.6L14 7M9 9v5M11 9v5"/></svg>
        </button>
        <button id="life-random" type="button" aria-label="Randomize animation">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h2c3 0 5 10 8 10h4m-3-3 3 3-3 3M3 15h2c1.5 0 2.5-2.5 3.5-5M11.5 7c.5-1.2 1-2 2-2H17m-3-3 3 3-3 3"/></svg>
        </button>
      </div>
      <div class="intro-copy">
        <h1 id="name" aria-label="Mateo Quiros Aspron"><span aria-hidden="true">Mateo</span><span aria-hidden="true">Quiros</span><span aria-hidden="true">Aspron</span></h1>
        <p>Applied Mathematics student</p>
        <p>Universidad Panamericana</p>
        <p>Machine learning · mathematical modeling · software</p>
      </div>
    </main>
    <script src="./assets/p5.js"></script>
    <script type="module" src="./assets/life-preview.js"></script>
  </body>
</html>
